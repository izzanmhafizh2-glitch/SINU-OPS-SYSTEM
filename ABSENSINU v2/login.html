<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ABSENSINU v2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f1419;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }
    
    /* Animated 3D City Background */
    .login-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0a1628 0%, #1a2942 50%, #0f3460 100%);
      overflow: hidden;
    }
    .city-animation {
      position: absolute;
      inset: 0;
      background-image: url('data:image/svg+xml,%3Csvg width="800" height="600" xmlns="http://www.w3.org/2000/svg"%3E%3Cdefs%3E%3ClinearGradient id="g1" x1="0%25" y1="0%25" x2="0%25" y2="100%25"%3E%3Cstop offset="0%25" style="stop-color:%2310b981;stop-opacity:0.3"/%3E%3Cstop offset="100%25" style="stop-color:%2310b981;stop-opacity:0"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill="url(%23g1)" width="100" height="300" x="50" y="150"/%3E%3Crect fill="url(%23g1)" width="80" height="250" x="180" y="200" opacity="0.7"/%3E%3Crect fill="url(%23g1)" width="120" height="320" x="300" y="130" opacity="0.5"/%3E%3C/svg%3E');
      background-size: cover;
      opacity: 0.4;
      animation: cityFloat 20s ease-in-out infinite;
    }
    @keyframes cityFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(16,185,129,0.05) 40px, rgba(16,185,129,0.05) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(16,185,129,0.05) 40px, rgba(16,185,129,0.05) 41px);
      animation: gridMove 30s linear infinite;
    }
    @keyframes gridMove { 0%{background-position:0 0} 100%{background-position:40px 40px} }
    
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: pulse 6s ease-in-out infinite;
    }
    .glow-orb.g1 { width:400px; height:400px; background:rgba(16,185,129,0.15); top:10%; left:15%; }
    .glow-orb.g2 { width:300px; height:300px; background:rgba(59,130,246,0.1); bottom:15%; right:20%; animation-delay:3s; }
    @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:0.7;transform:scale(1.1)} }
    
    /* Logo */
    .logo-corner {
      position: absolute;
      top: 30px;
      left: 40px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .logo-text {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    /* Login Container */
    .login-container {
      position: relative;
      z-index: 5;
      width: 420px;
      max-width: 90vw;
    }
    
    /* Form Box */
    .form-box {
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .form-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin: 0 0 8px;
      text-align: center;
    }
    .form-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin: 0 0 28px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #3b82f6;
      background: rgba(15,23,42,1);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-input::placeholder { color: #475569; }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }
    .input-icon-right {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }
    .input-icon-right:hover { color: #94a3b8; }
    
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
    }
    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .remember-row label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-weight: 500;
    }
    
    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59,130,246,0.4);
    }
    .login-btn:hover { 
      transform: translateY(-1px); 
      box-shadow: 0 6px 20px rgba(59,130,246,0.5); 
    }
    .login-btn:active { transform: translateY(0); }
    
    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  
  <!-- Animated Background -->
  <div class="login-bg">
    <div class="city-animation"></div>
    <div class="grid-overlay"></div>
    <div class="glow-orb g1"></div>
    <div class="glow-orb g2"></div>
  </div>
  
  <!-- Logo -->
  <div class="logo-corner">
    <div class="logo-icon">
      <i class="fa-solid fa-fingerprint" style="color:#10b981; font-size:22px;"></i>
    </div>
    <div class="logo-text">ABSENSINU</div>
  </div>
  
  <!-- Login Container -->
  <div class="login-container">
    
    <!-- Form Box -->
    <div class="form-box">
      <h2 class="form-title">Selamat Datang</h2>
      <p class="form-subtitle">Masuk ke sistem manajemen operasional</p>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrap">
            <i class="input-icon fa-solid fa-user"></i>
            <input type="text" id="login-username" class="form-input" 
                   placeholder="Masukkan username" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="input-icon fa-solid fa-lock"></i>
            <input type="password" id="login-password" class="form-input" 
                   placeholder="Masukkan password" required>
            <i class="input-icon-right fa-solid fa-eye" id="toggle-pwd" onclick="togglePassword()"></i>
          </div>
        </div>
        
        <div class="remember-row">
          <input type="checkbox" id="remember-me">
          <label for="remember-me">Ingat saya di perangkat ini</label>
        </div>
        
        <button type="submit" id="btn-login" class="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Masuk ke Sistem</span>
        </button>
        
      </form>
    </div>
    
    <div class="login-footer">
      &copy; 2026 PT SINU. All rights reserved.
    </div>
    
  </div>
  
  <script>
    function togglePassword() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('toggle-pwd');
      if(pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
    
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('remember-me').checked;
      const btn = document.getElementById('btn-login');
      
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Memproses...</span>';
      btn.disabled = true;
      
      const accounts = {
        'admin': {password: 'admin123', name: 'Admin Demo', role: 'admin'},
        'teknisi': {password: 'teknisi123', name: 'Teknisi Demo', role: 'teknisi'},
        'noc': {password: 'noc123', name: 'NOC Demo', role: 'noc'},
        'cs': {password: 'cs123', name: 'CS Demo', role: 'cs'},
        'spv': {password: 'spv123', name: 'Supervisor Demo', role: 'supervisor'}
      };
      
      setTimeout(() => {
        const account = accounts[username];
        if(account && password === account.password) {
          if(remember) {
            localStorage.setItem('sinu_v2_remember', JSON.stringify({username, password}));
          }
          localStorage.setItem('sinu_v2_user', JSON.stringify({
            username: username,
            name: account.name,
            role: account.role
          }));
          window.location.href = 'index.html';
        } else {
          alert('Username atau password salah');
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Masuk ke Sistem</span>';
          btn.disabled = false;
        }
      }, 1000);
    }
    
    // Auto-fill dari remember me
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('sinu_v2_remember');
        if(saved) {
          const {username, password} = JSON.parse(saved);
          document.getElementById('login-username').value = username || '';
          document.getElementById('login-password').value = password || '';
          document.getElementById('remember-me').checked = true;
        }
      } catch(e) {}
    });
  </script>
  
</body>
</html>
