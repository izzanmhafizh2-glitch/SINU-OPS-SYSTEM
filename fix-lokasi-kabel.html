<!DOCTYPE html>
<html>
<head>
  <title>Fix Lokasi Kabel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e293b; color: #e2e8f0; }
    button { padding: 12px 24px; margin: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-check { background: #3b82f6; color: white; }
    .btn-fix { background: #10b981; color: white; }
    pre { background: #0f172a; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; white-space: pre-wrap; }
    .success { color: #10b981; } .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🔧 Fix Lokasi Kabel — Hapus "(sisa Xm)"</h1>
  <button class="btn-check" onclick="cek()">1. Cek data yang perlu difix</button>
  <button class="btn-fix" onclick="fix()">2. Fix sekarang</button>
  <div id="result"></div>
  <script>
    const supa = supabase.createClient(
      'https://pasmdewdganfgdnntwam.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhc21kZXdkZ2FuZmdkbm50d2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Njc3OTgsImV4cCI6MjEwMzU0Mzc5OH0.3NKjbhz0IzVAjMGOGlnvyWptDyNPejzrbIYD1QNT-2U'
    );
    function log(t, d, cls='') {
      document.getElementById('result').innerHTML += `<h3>${t}</h3><pre class="${cls}">${typeof d==='string'?d:JSON.stringify(d,null,2)}</pre>`;
    }
    async function cek() {
      document.getElementById('result').innerHTML = '';
      const { data } = await supa.from('perangkat').select('sn,lokasi').ilike('lokasi','%(sisa%');
      log(`Ditemukan ${(data||[]).length} data dengan lokasi berisi "(sisa..."`, data, 'success');
    }
    async function fix() {
      document.getElementById('result').innerHTML = '';
      const { data } = await supa.from('perangkat').select('sn,lokasi').ilike('lokasi','%(sisa%');
      if(!data?.length) { log('✅ Tidak ada data yang perlu difix', ''); return; }
      let fixed = 0, errors = 0;
      for(const row of data) {
        // Hapus " (sisa Xm)" dari lokasi
        const lokasiClean = row.lokasi.replace(/\s*\(sisa\s*\d+m\)/gi, '').trim();
        const res = await supa.from('perangkat').update({ lokasi: lokasiClean }).eq('sn', row.sn);
        if(res.error) { errors++; log('❌ Error ' + row.sn, res.error, 'error'); }
        else { fixed++; log(`✅ ${row.sn}: "${row.lokasi}" → "${lokasiClean}"`, '', 'success'); }
      }
      log(`Selesai: ${fixed} berhasil, ${errors} gagal`, '');
    }
  </script>
</body>
</html>
