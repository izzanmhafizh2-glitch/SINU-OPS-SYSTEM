<!DOCTYPE html>
<html>
<head>
  <title>Add avatar_url column</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e293b; color: #e2e8f0; }
    button { padding: 12px 24px; margin: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; background: #3b82f6; color: white; }
    pre { background: #0f172a; padding: 15px; border-radius: 8px; white-space: pre-wrap; border: 1px solid #334155; }
    .success { color: #10b981; } .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🔧 Setup Kolom avatar_url di tabel akun</h1>
  <p style="color:#94a3b8">Klik tombol di bawah untuk mengecek dan menambahkan kolom avatar_url</p>

  <button onclick="cekDanTambah()">▶ Jalankan Setup</button>
  <div id="result"></div>

  <script>
    const supa = supabase.createClient(
      'https://pasmdewdganfgdnntwam.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhc21kZXdkZ2FuZmdkbm50d2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Njc3OTgsImV4cCI6MjEwMzU0Mzc5OH0.3NKjbhz0IzVAjMGOGlnvyWptDyNPejzrbIYD1QNT-2U'
    );

    function log(msg, cls='') {
      document.getElementById('result').innerHTML += `<pre class="${cls}">${msg}</pre>`;
    }

    async function cekDanTambah() {
      document.getElementById('result').innerHTML = '';
      log('⏳ Mengecek tabel akun...');

      try {
        // Coba baca kolom avatar_url
        const { data, error } = await supa.from('akun').select('username, avatar_url').limit(1);

        if(error && error.message.includes('avatar_url')) {
          log('❌ Kolom avatar_url belum ada.', 'error');
          log('📋 Buka Supabase Dashboard → SQL Editor → jalankan query ini:\n\nALTER TABLE akun ADD COLUMN IF NOT EXISTS avatar_url TEXT;', 'error');
          log('\n💡 Link Supabase Dashboard:\nhttps://app.supabase.com/project/pasmdewdganfgdnntwam/editor');
        } else if(error) {
          log('❌ Error: ' + error.message, 'error');
        } else {
          log('✅ Kolom avatar_url sudah ada!', 'success');
          log('Data sample: ' + JSON.stringify(data, null, 2), 'success');
          log('\n✅ Setup selesai. Silakan test upload foto profil di aplikasi.', 'success');
        }
      } catch(e) {
        log('❌ Exception: ' + e.message, 'error');
      }
    }
  </script>
</body>
</html>
